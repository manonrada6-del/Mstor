<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقارير البيع | DarkStore</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Chart.js للرسوم البيانية -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      direction: rtl;
      font-family: 'Cairo', 'Poppins', 'Tahoma', sans-serif;
      color: #ffffff;
    }

    /* خلفية متحركة */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #1a1a2e, #0a0a0f);
      z-index: -2;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, rgba(139, 92, 246, 0.03) 0px, rgba(139, 92, 246, 0.03) 2px, transparent 2px, transparent 8px);
    }

    /* كرات ضبابية */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
    }
    .orb-1 { width: 400px; height: 400px; background: #8b5cf6; top: -150px; right: -150px; opacity: 0.2; }
    .orb-2 { width: 350px; height: 350px; background: #ec4899; bottom: -100px; left: -100px; opacity: 0.15; }
    .orb-3 { width: 300px; height: 300px; background: #06b6d4; top: 50%; left: 30%; opacity: 0.1; }

    /* هيدر */
    .header {
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      background: rgba(30, 30, 45, 0.8);
      padding: 10px 22px;
      border-radius: 40px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .nav-btn:hover, .nav-btn.active {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
    }

    /* المحتوى الرئيسي */
    .reports-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* عنوان الصفحة */
    .page-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .page-title i { color: #c084fc; }
    .page-title span { background: linear-gradient(135deg, #fff, #c084fc); -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* فلاتر التاريخ */
    .filters-bar {
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 20px 25px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .date-filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(45, 45, 68, 0.8);
      border: none;
      padding: 10px 22px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #8b5cf6;
    }

    .custom-date {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .custom-date input {
      background: rgba(10, 10, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      font-size: 14px;
    }

    /* بطاقات الإحصائيات */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
      margin-bottom: 35px;
    }

    .stat-card {
      background: linear-gradient(145deg, #13131f, #0c0c16);
      border-radius: 28px;
      padding: 25px;
      border: 1px solid rgba(139, 92, 246, 0.2);
      transition: all 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: rgba(139, 92, 246, 0.5);
    }

    .stat-icon {
      font-size: 40px;
      color: #c084fc;
      margin-bottom: 15px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stat-label {
      color: #a0a0b0;
      font-size: 14px;
    }

    .stat-change {
      font-size: 13px;
      margin-top: 10px;
    }
    .stat-change.positive { color: #10b981; }
    .stat-change.negative { color: #ef4444; }

    /* الرسوم البيانية */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 30px;
      margin-bottom: 35px;
    }

    .chart-card {
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 25px;
      border: 1px solid rgba(139, 92, 246, 0.15);
    }

    .chart-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c084fc;
    }

    canvas {
      max-height: 300px;
      width: 100%;
    }

    /* قائمة الطلبات */
    .orders-section {
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 25px;
      border: 1px solid rgba(139, 92, 246, 0.15);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      background: rgba(10, 10, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      width: 250px;
    }

    .orders-table {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px 12px;
      text-align: right;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th {
      color: #c084fc;
      font-weight: 600;
    }

    .order-row:hover {
      background: rgba(139, 92, 246, 0.1);
    }

    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-completed { background: #10b98120; color: #10b981; }
    .badge-pending { background: #f59e0b20; color: #f59e0b; }
    .badge-cancelled { background: #ef444420; color: #ef4444; }

    .view-details {
      background: rgba(139, 92, 246, 0.2);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      color: #c084fc;
      cursor: pointer;
    }

    /* نافذة تفاصيل الطلب */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
      border-radius: 32px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    /* توست */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b2e;
      backdrop-filter: blur(20px);
      padding: 14px 30px;
      border-radius: 60px;
      animation: slideUp 0.4s ease;
      z-index: 1100;
      font-weight: 600;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(30px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 900px) {
      .reports-wrapper { padding: 20px; }
      .charts-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .filters-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<header class="header">
  <div class="logo">
    <i class="fas fa-crown"></i> DARK STORE
  </div>
  <div class="nav-buttons">
    <a href="index.html" class="nav-btn"><i class="fas fa-store"></i> المتجر</a>
    <a href="cart.html" class="nav-btn"><i class="fas fa-shopping-cart"></i> السلة</a>
    <a href="admin.html" class="nav-btn"><i class="fas fa-chart-line"></i> لوحة التحكم</a>
    <a href="reports.html" class="nav-btn active"><i class="fas fa-chart-pie"></i> التقارير</a>
  </div>
</header>

<div class="reports-wrapper">
  <div class="page-title">
    <i class="fas fa-chart-pie"></i>
    <span>تقارير البيع والإحصائيات</span>
  </div>

  <!-- فلاتر التاريخ -->
  <div class="filters-bar">
    <div class="date-filters">
      <button class="filter-btn" onclick="setDateFilter('today')">اليوم</button>
      <button class="filter-btn" onclick="setDateFilter('week')">آخر 7 أيام</button>
      <button class="filter-btn" onclick="setDateFilter('month')">آخر 30 يوم</button>
      <button class="filter-btn" onclick="setDateFilter('year')">آخر سنة</button>
      <button class="filter-btn" onclick="setDateFilter('all')">كل الوقت</button>
    </div>
    <div class="custom-date">
      <input type="date" id="startDate">
      <span>إلى</span>
      <input type="date" id="endDate">
      <button class="filter-btn" onclick="setCustomDate()">تطبيق</button>
    </div>
  </div>

  <!-- بطاقات الإحصائيات -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
      <div class="stat-value" id="totalRevenue">0</div>
      <div class="stat-label">إجمالي الإيرادات</div>
      <div class="stat-change" id="revenueChange"></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-shopping-bag"></i></div>
      <div class="stat-value" id="totalOrders">0</div>
      <div class="stat-label">عدد الطلبات</div>
      <div class="stat-change" id="ordersChange"></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-box"></i></div>
      <div class="stat-value" id="totalItems">0</div>
      <div class="stat-label">المنتجات المباعة</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
      <div class="stat-value" id="avgOrder">0</div>
      <div class="stat-label">متوسط قيمة الطلب</div>
    </div>
  </div>

  <!-- الرسوم البيانية -->
  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-title"><i class="fas fa-chart-line"></i> المبيعات اليومية</div>
      <canvas id="salesChart"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title"><i class="fas fa-chart-pie"></i> المنتجات الأكثر مبيعاً</div>
      <canvas id="productsChart"></canvas>
    </div>
  </div>

  <!-- قائمة الطلبات -->
  <div class="orders-section">
    <div class="section-header">
      <div class="section-title">
        <i class="fas fa-list-ul"></i> قائمة الطلبات
      </div>
      <div class="search-box">
        <input type="text" id="searchOrder" placeholder="بحث بالاسم أو رقم الجوال" onkeyup="filterOrders()">
        <button class="filter-btn" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> تصدير Excel</button>
      </div>
    </div>
    <div class="orders-table">
      <table id="ordersTable">
        <thead>
          <tr><th>رقم الطلب</th><th>التاريخ</th><th>العميل</th><th>الجوال</th><th>المنتجات</th><th>الإجمالي</th><th>الحالة</th><th>تفاصيل</th></tr>
        </thead>
        <tbody id="ordersList"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- نافذة تفاصيل الطلب -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3><i class="fas fa-receipt"></i> تفاصيل الطلب</h3>
      <button class="close-modal" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalDetails"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
    authDomain: "tok-tak-d6e17.firebaseapp.com",
    databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
    projectId: "tok-tak-d6e17",
    storageBucket: "tok-tak-d6e17.appspot.com",
    messagingSenderId: "547062578826",
    appId: "1:547062578826:web:aa285cf798341be07cb773"
  };
  
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let allOrders = [];
  let filteredOrders = [];
  let currentFilter = 'all';
  let startDateFilter = null;
  let endDateFilter = null;

  let salesChart = null;
  let productsChart = null;

  // تحميل الطلبات من localStorage
  function loadOrders() {
    const saved = localStorage.getItem("storeOrders");
    if (saved) {
      try {
        allOrders = JSON.parse(saved);
        allOrders.sort((a, b) => new Date(b.date) - new Date(a.date));
      } catch(e) {}
    }
    applyFilter();
  }

  // تطبيق الفلتر
  function applyFilter() {
    const now = new Date();
    let filtered = [...allOrders];

    if (currentFilter === 'today') {
      const today = new Date().toDateString();
      filtered = filtered.filter(o => new Date(o.date).toDateString() === today);
    } else if (currentFilter === 'week') {
      const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      filtered = filtered.filter(o => new Date(o.date) >= weekAgo);
    } else if (currentFilter === 'month') {
      const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
      filtered = filtered.filter(o => new Date(o.date) >= monthAgo);
    } else if (currentFilter === 'year') {
      const yearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
      filtered = filtered.filter(o => new Date(o.date) >= yearAgo);
    } else if (startDateFilter && endDateFilter) {
      filtered = filtered.filter(o => {
        const orderDate = new Date(o.date);
        return orderDate >= startDateFilter && orderDate <= endDateFilter;
      });
    }

    filteredOrders = filtered;
    updateStats();
    updateSalesChart();
    updateProductsChart();
    displayOrders();
  }

  // تحديث الإحصائيات
  function updateStats() {
    const totalRevenue = filteredOrders.reduce((sum, o) => sum + o.total, 0);
    const totalOrders = filteredOrders.length;
    const totalItems = filteredOrders.reduce((sum, o) => sum + (o.items?.reduce((s, i) => s + i.quantity, 0) || 0), 0);
    const avgOrder = totalOrders > 0 ? (totalRevenue / totalOrders).toFixed(2) : 0;

    document.getElementById("totalRevenue").innerHTML = `${totalRevenue.toLocaleString()}$`;
    document.getElementById("totalOrders").innerHTML = totalOrders;
    document.getElementById("totalItems").innerHTML = totalItems;
    document.getElementById("avgOrder").innerHTML = `${avgOrder}$`;

    // حساب نسبة التغير (مقارنة بالفترة السابقة)
    updateChangePercentage();
  }

  function updateChangePercentage() {
    const now = new Date();
    let previousFiltered = [...allOrders];
    
    if (currentFilter === 'today') {
      const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000).toDateString();
      previousFiltered = previousFiltered.filter(o => new Date(o.date).toDateString() === yesterday);
    } else if (currentFilter === 'week') {
      const weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      const weekEnd = now;
      previousFiltered = previousFiltered.filter(o => {
        const d = new Date(o.date);
        return d >= new Date(weekStart.getTime() - 7 * 24 * 60 * 60 * 1000) && d < weekStart;
      });
    } else {
      document.getElementById("revenueChange").innerHTML = "";
      return;
    }

    const currentRevenue = filteredOrders.reduce((sum, o) => sum + o.total, 0);
    const previousRevenue = previousFiltered.reduce((sum, o) => sum + o.total, 0);
    
    if (previousRevenue > 0) {
      const change = ((currentRevenue - previousRevenue) / previousRevenue * 100).toFixed(1);
      const changeClass = change >= 0 ? 'positive' : 'negative';
      const changeIcon = change >= 0 ? '▲' : '▼';
      document.getElementById("revenueChange").innerHTML = `${changeIcon} ${Math.abs(change)}% عن الفترة السابقة`;
      document.getElementById("revenueChange").className = `stat-change ${changeClass}`;
    }
  }

  // رسم بياني للمبيعات
  function updateSalesChart() {
    const salesByDate = {};
    filteredOrders.forEach(order => {
      const date = new Date(order.date).toLocaleDateString('ar');
      salesByDate[date] = (salesByDate[date] || 0) + order.total;
    });

    const labels = Object.keys(salesByDate).slice(-14);
    const data = labels.map(l => salesByDate[l]);

    const ctx = document.getElementById('salesChart').getContext('2d');
    if (salesChart) salesChart.destroy();
    
    salesChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'المبيعات ($)',
          data: data,
          borderColor: '#c084fc',
          backgroundColor: 'rgba(139, 92, 246, 0.1)',
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff' } } }
      }
    });
  }

  // رسم بياني للمنتجات الأكثر مبيعاً
  function updateProductsChart() {
    const productSales = {};
    filteredOrders.forEach(order => {
      order.items?.forEach(item => {
        productSales[item.name] = (productSales[item.name] || 0) + item.quantity;
      });
    });

    const sorted = Object.entries(productSales).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const labels = sorted.map(s => s[0]);
    const data = sorted.map(s => s[1]);

    const ctx = document.getElementById('productsChart').getContext('2d');
    if (productsChart) productsChart.destroy();
    
    productsChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: ['#c084fc', '#ec4899', '#06b6d4', '#f59e0b', '#10b981']
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#fff' } } }
      }
    });
  }

  // عرض الطلبات في الجدول
  function displayOrders() {
    const tbody = document.getElementById("ordersList");
    tbody.innerHTML = "";
    
    filteredOrders.forEach(order => {
      const row = tbody.insertRow();
      row.className = "order-row";
      row.innerHTML = `
        <td>#${order.id?.toString().slice(-6)}</td>
        <td>${order.date || '-'}</td>
        <td>${order.name || '-'}</td>
        <td>${order.phone || '-'}</td>
        <td>${order.items?.reduce((s, i) => s + i.quantity, 0) || 0} قطعة</td>
        <td>${order.total || 0}$</td>
        <td><span class="badge badge-completed">مكتمل</span></td>
        <td><button class="view-details" onclick="showOrderDetails(${JSON.stringify(order).replace(/"/g, '&quot;')})"><i class="fas fa-eye"></i></button></td>
      `;
    });
  }

  // عرض تفاصيل الطلب
  function showOrderDetails(order) {
    const modal = document.getElementById("orderModal");
    const detailsDiv = document.getElementById("modalDetails");
    
    let itemsHtml = "<div style='margin-top:15px'><strong>المنتجات:</strong><ul style='margin-top:10px'>";
    order.items?.forEach(item => {
      itemsHtml += `<li>${item.name} - ${item.price}$ × ${item.quantity} = ${item.price * item.quantity}$</li>`;
    });
    itemsHtml += "</ul></div>";

    detailsDiv.innerHTML = `
      <p><strong><i class="fas fa-user"></i> الاسم:</strong> ${order.name}</p>
      <p><strong><i class="fas fa-phone"></i> الجوال:</strong> ${order.phone}</p>
      <p><strong><i class="fas fa-map-marker-alt"></i> العنوان:</strong> ${order.address}</p>
      <p><strong><i class="fas fa-calendar"></i> التاريخ:</strong> ${order.date}</p>
      ${itemsHtml}
      <p style="margin-top:15px; font-size:20px; color:#facc15"><strong>الإجمالي:</strong> ${order.total}$</p>
    `;
    
    modal.classList.add("active");
  }

  function closeModal() {
    document.getElementById("orderModal").classList.remove("active");
  }

  // فلترة التاريخ
  function setDateFilter(filter) {
    currentFilter = filter;
    startDateFilter = null;
    endDateFilter = null;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    applyFilter();
  }

  function setCustomDate() {
    const start = document.getElementById("startDate").value;
    const end = document.getElementById("endDate").value;
    if (start && end) {
      currentFilter = 'custom';
      startDateFilter = new Date(start);
      endDateFilter = new Date(end);
      endDateFilter.setHours(23, 59, 59);
      applyFilter();
    }
  }

  function filterOrders() {
    const search = document.getElementById("searchOrder").value.toLowerCase();
    const filtered = filteredOrders.filter(o => 
      o.name?.toLowerCase().includes(search) || 
      o.phone?.includes(search)
    );
    displayFilteredOrders(filtered);
  }

  function displayFilteredOrders(orders) {
    const tbody = document.getElementById("ordersList");
    tbody.innerHTML = "";
    orders.forEach(order => {
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>#${order.id?.toString().slice(-6)}</td>
        <td>${order.date || '-'}</td>
        <td>${order.name || '-'}</td>
        <td>${order.phone || '-'}</td>
        <td>${order.items?.reduce((s, i) => s + i.quantity, 0) || 0} قطعة</td>
        <td>${order.total || 0}$</td>
        <td><span class="badge badge-completed">مكتمل</span></td>
        <td><button class="view-details" onclick='showOrderDetails(${JSON.stringify(order).replace(/'/g, "\\'")})'><i class="fas fa-eye"></i></button></td>
      `;
    });
  }

  // تصدير إلى Excel
  function exportToExcel() {
    let csv = "رقم الطلب,التاريخ,العميل,الجوال,العنوان,المنتجات,الإجمالي\n";
    filteredOrders.forEach(order => {
      const products = order.items?.map(i => `${i.name} x${i.quantity}`).join(" | ") || "";
      csv += `#${order.id},${order.date},${order.name},${order.phone},${order.address},"${products}",${order.total}\n`;
    });
    
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `تقارير_المبيعات_${new Date().toLocaleDateString()}.csv`;
    link.click();
    showToast("📊 تم تصدير التقرير بنجاح", "#10b981");
  }

  function showToast(msg, color) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
    toast.style.background = color;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // إضافة طلب تجريبي للاختبار
  function addDemoOrder() {
    const demoOrders = JSON.parse(localStorage.getItem("storeOrders") || "[]");
    if (demoOrders.length === 0) {
      const sampleOrder = {
        id: Date.now(),
        name: "أحمد محمد",
        phone: "01012345678",
        address: "القاهرة - مصر الجديدة",
        items: [{ name: "حذاء رياضي", price: 120, quantity: 1 }],
        total: 120,
        date: new Date().toLocaleString()
      };
      demoOrders.push(sampleOrder);
      localStorage.setItem("storeOrders", JSON.stringify(demoOrders));
    }
    loadOrders();
  }

  // تحميل البيانات
  loadOrders();
  addDemoOrder();

  // إغلاق المودال عند الضغط خارجها
  window.onclick = (e) => {
    const modal = document.getElementById("orderModal");
    if (e.target === modal) closeModal();
  };
</script>
</body>
  </html>
