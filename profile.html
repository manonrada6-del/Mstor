<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بروفايل العميل | DarkStore</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      direction: rtl;
      font-family: 'Cairo', 'Poppins', 'Tahoma', sans-serif;
      color: #ffffff;
    }

    /* خلفية متحركة */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #1a1a2e, #0a0a0f);
      z-index: -2;
    }

    .bg-gradient::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, rgba(139, 92, 246, 0.03) 0px, rgba(139, 92, 246, 0.03) 2px, transparent 2px, transparent 8px);
    }

    /* كرات ضبابية */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
    }
    .orb-1 { width: 400px; height: 400px; background: #8b5cf6; top: -150px; right: -150px; opacity: 0.2; }
    .orb-2 { width: 350px; height: 350px; background: #ec4899; bottom: -100px; left: -100px; opacity: 0.15; }

    /* هيدر */
    .header {
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      background: rgba(30, 30, 45, 0.8);
      padding: 10px 22px;
      border-radius: 40px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .nav-btn:hover, .nav-btn.active {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
    }

    /* المحتوى الرئيسي */
    .profile-wrapper {
      max-width: 1300px;
      margin: 0 auto;
      padding: 40px;
    }

    /* صفحة البحث عن العميل */
    .search-section {
      min-height: calc(100vh - 80px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .search-card {
      background: linear-gradient(145deg, #13131f, #0c0c16);
      border-radius: 48px;
      padding: 50px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .search-icon {
      font-size: 60px;
      color: #c084fc;
      margin-bottom: 20px;
    }

    .search-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .search-subtitle {
      color: #a0a0b0;
      margin-bottom: 30px;
    }

    .phone-input-group {
      margin-bottom: 25px;
    }

    .phone-input-group input {
      width: 100%;
      padding: 15px 20px;
      background: rgba(10, 10, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      color: white;
      font-size: 16px;
      text-align: center;
      transition: all 0.3s;
    }

    .phone-input-group input:focus {
      border-color: #8b5cf6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .search-btn {
      width: 100%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      padding: 15px;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .search-btn:hover {
      transform: scale(1.02);
    }

    /* بروفايل العميل */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .avatar {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .welcome-text h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .welcome-text p {
      color: #a0a0b0;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-box {
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(139, 92, 246, 0.15);
    }
    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: #c084fc;
    }

    /* تبويبات */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }
    .tab {
      background: none;
      border: none;
      padding: 12px 28px;
      color: #a0a0b0;
      cursor: pointer;
      border-radius: 40px;
      transition: all 0.3s;
      font-weight: 600;
    }
    .tab.active {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* نموذج المعلومات */
    .info-form {
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 30px;
      border: 1px solid rgba(139, 92, 246, 0.15);
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-field label {
      font-size: 14px;
      color: #a0a0b0;
    }
    .form-field input, .form-field textarea {
      padding: 12px 16px;
      background: rgba(10, 10, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: white;
    }
    .save-btn {
      background: #8b5cf6;
      border: none;
      padding: 12px 30px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    /* قائمة الطلبات */
    .orders-list {
      background: rgba(15, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 25px;
    }
    .order-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .order-info {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .order-badge {
      background: #10b98120;
      color: #10b981;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
    }
    .order-total {
      font-size: 20px;
      font-weight: 700;
      color: #facc15;
    }
    .view-order {
      background: rgba(139, 92, 246, 0.2);
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      color: #c084fc;
      cursor: pointer;
    }
    .empty-orders {
      text-align: center;
      padding: 50px;
      color: #6b7280;
    }

    /* نافذة تفاصيل الطلب */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
      border-radius: 32px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .close-modal {
      float: left;
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .logout-area {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }
    .change-phone-btn {
      background: rgba(220, 38, 38, 0.8);
      border: none;
      padding: 12px 30px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .change-phone-btn:hover {
      background: #dc2626;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b2e;
      backdrop-filter: blur(20px);
      padding: 14px 30px;
      border-radius: 60px;
      animation: slideUp 0.4s ease;
      z-index: 1100;
      font-weight: 600;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(30px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 800px) {
      .profile-wrapper { padding: 20px; }
      .profile-header { flex-direction: column; text-align: center; }
      .tabs { justify-content: center; }
      .search-card { padding: 30px; margin: 20px; }
    }
  </style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<header class="header">
  <div class="logo">
    <i class="fas fa-crown"></i> DARK STORE
  </div>
  <div class="nav-buttons">
    <a href="index.html" class="nav-btn"><i class="fas fa-store"></i> المتجر</a>
    <a href="cart.html" class="nav-btn"><i class="fas fa-shopping-cart"></i> السلة</a>
    <a href="profile.html" class="nav-btn active"><i class="fas fa-user"></i> بروفايلي</a>
    <a href="reports.html" class="nav-btn"><i class="fas fa-chart-pie"></i> التقارير</a>
  </div>
</header>

<!-- صفحة البحث عن العميل برقم الجوال -->
<div id="searchSection" class="search-section">
  <div class="search-card">
    <div class="search-icon"><i class="fas fa-id-card"></i></div>
    <div class="search-title">بروفايل العميل</div>
    <div class="search-subtitle">أدخل رقم جوالك لعرض بياناتك وطلباتك السابقة</div>
    <div class="phone-input-group">
      <input type="tel" id="searchPhone" placeholder="مثال: 01012345678" maxlength="11">
    </div>
    <button class="search-btn" onclick="searchCustomer()"><i class="fas fa-search"></i> عرض بروفايلي</button>
  </div>
</div>

<!-- بروفايل العميل -->
<div id="profileSection" style="display:none;">
  <div class="profile-wrapper">
    <div class="profile-header">
      <div class="avatar"><i class="fas fa-user"></i></div>
      <div class="welcome-text">
        <h2 id="welcomeName">مرحباً، اسم العميل</h2>
        <p><i class="fas fa-map-marker-alt"></i> <span id="userAddress">العنوان غير محدد</span></p>
        <p><i class="fas fa-phone"></i> <span id="userPhone">رقم الجوال</span></p>
      </div>
    </div>

    <div class="profile-stats">
      <div class="stat-box"><div class="stat-number" id="totalOrdersCount">0</div><div>عدد الطلبات</div></div>
      <div class="stat-box"><div class="stat-number" id="totalSpent">0</div><div>إجمالي المشتريات</div></div>
      <div class="stat-box"><div class="stat-number" id="memberSince">-</div><div>أول طلب</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('orders')"><i class="fas fa-shopping-bag"></i> طلباتي</button>
      <button class="tab" onclick="switchTab('info')"><i class="fas fa-user-edit"></i> المعلومات الشخصية</button>
    </div>

    <div id="ordersTab" class="tab-content active">
      <div class="orders-list" id="ordersListContainer"></div>
    </div>

    <div id="infoTab" class="tab-content">
      <div class="info-form">
        <div class="form-row">
          <div class="form-field"><label>الاسم الكامل</label><input type="text" id="editName"></div>
          <div class="form-field"><label>رقم الجوال</label><input type="tel" id="editPhone" readonly style="background:#1a1a2e; opacity:0.7;"></div>
        </div>
        <div class="form-field"><label>العنوان</label><textarea id="editAddress" rows="3"></textarea></div>
        <button class="save-btn" onclick="updateProfile()"><i class="fas fa-save"></i> حفظ التغييرات</button>
      </div>
    </div>

    <div class="logout-area">
      <button class="change-phone-btn" onclick="changePhone()"><i class="fas fa-arrow-right"></i> البحث برقم آخر</button>
    </div>
  </div>
</div>

<!-- نافذة تفاصيل الطلب -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">&times;</button>
    <h3><i class="fas fa-receipt"></i> تفاصيل الطلب</h3>
    <div id="modalDetails"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
    authDomain: "tok-tak-d6e17.firebaseapp.com",
    databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
    projectId: "tok-tak-d6e17",
    storageBucket: "tok-tak-d6e17.appspot.com",
    messagingSenderId: "547062578826",
    appId: "1:547062578826:web:aa285cf798341be07cb773"
  };
  
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let currentCustomer = null;
  let currentPhone = null;

  // البحث عن العميل
  function searchCustomer() {
    const phone = document.getElementById("searchPhone").value.trim();
    if (!phone) {
      showToast("⚠️ الرجاء إدخال رقم الجوال", "#f97316");
      return;
    }
    
    const phoneRegex = /^[0-9]{10,11}$/;
    if (!phoneRegex.test(phone)) {
      showToast("⚠️ رقم الجوال غير صحيح (10-11 رقم)", "#f97316");
      return;
    }

    currentPhone = phone;
    
    // البحث في Firebase عن العميل
    database.ref('customers').orderByChild('phone').equalTo(phone).once('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // عميل موجود
        Object.keys(data).forEach(key => {
          currentCustomer = { id: key, ...data[key] };
        });
        showProfile();
      } else {
        // عميل جديد - إنشاء حساب
        const newCustomer = {
          name: "عميل جديد",
          phone: phone,
          address: "",
          createdAt: new Date().toISOString(),
          totalSpent: 0
        };
        database.ref('customers').push(newCustomer).then((res) => {
          currentCustomer = { id: res.key, ...newCustomer };
          showProfile();
          showToast("✅ مرحباً بك! يمكنك تحديث بياناتك", "#10b981");
        });
      }
    });
  }

  // عرض البروفايل
  function showProfile() {
    document.getElementById("searchSection").style.display = "none";
    document.getElementById("profileSection").style.display = "block";
    
    document.getElementById("welcomeName").innerHTML = `مرحباً، ${currentCustomer.name || "عميلنا العزيز"}`;
    document.getElementById("userAddress").innerHTML = currentCustomer.address || "لم يتم الإضافة";
    document.getElementById("userPhone").innerHTML = currentCustomer.phone;
    
    document.getElementById("editName").value = currentCustomer.name || "";
    document.getElementById("editPhone").value = currentCustomer.phone;
    document.getElementById("editAddress").value = currentCustomer.address || "";
    
    // حساب إحصائيات العميل من الطلبات
    loadCustomerOrders();
  }

  // تحميل طلبات العميل
  function loadCustomerOrders() {
    const allOrders = JSON.parse(localStorage.getItem("storeOrders") || "[]");
    const customerOrders = allOrders.filter(o => o.phone === currentCustomer.phone);
    
    const totalOrders = customerOrders.length;
    const totalSpent = customerOrders.reduce((sum, o) => sum + o.total, 0);
    
    document.getElementById("totalOrdersCount").innerHTML = totalOrders;
    document.getElementById("totalSpent").innerHTML = totalSpent.toLocaleString() + "$";
    
    // أول طلب
    if (customerOrders.length > 0) {
      const oldestOrder = customerOrders.reduce((oldest, o) => {
        return new Date(o.date) < new Date(oldest.date) ? o : oldest;
      });
      const firstOrderDate = new Date(oldestOrder.date).toLocaleDateString('ar');
      document.getElementById("memberSince").innerHTML = firstOrderDate;
    } else {
      document.getElementById("memberSince").innerHTML = "لا توجد طلبات";
    }
    
    // تحديث totalSpent في Firebase
    database.ref('customers/' + currentCustomer.id).update({ totalSpent: totalSpent });
    
    displayOrders(customerOrders);
  }

  function displayOrders(orders) {
    const container = document.getElementById("ordersListContainer");
    if (orders.length === 0) {
      container.innerHTML = `<div class="empty-orders"><i class="fas fa-box-open"></i> لا توجد طلبات بعد</div>`;
      return;
    }
    container.innerHTML = orders.reverse().map(order => `
      <div class="order-card">
        <div class="order-info">
          <span class="order-badge"><i class="fas fa-calendar"></i> ${order.date || '-'}</span>
          <span>${order.items?.reduce((s,i) => s + i.quantity, 0) || 0} منتج</span>
          <span class="order-total">${order.total}$</span>
        </div>
        <button class="view-order" onclick="showOrderDetails(${JSON.stringify(order).replace(/"/g, '&quot;')})"><i class="fas fa-eye"></i> التفاصيل</button>
      </div>
    `).join('');
  }

  function showOrderDetails(order) {
    const modal = document.getElementById("orderModal");
    const detailsDiv = document.getElementById("modalDetails");
    
    let itemsHtml = "<div style='margin-top:15px'><strong>المنتجات:</strong><ul style='margin-top:10px'>";
    order.items?.forEach(item => {
      itemsHtml += `<li>${item.name} - ${item.price}$ × ${item.quantity} = ${item.price * item.quantity}$</li>`;
    });
    itemsHtml += "</ul></div>";

    detailsDiv.innerHTML = `
      <p><strong><i class="fas fa-user"></i> الاسم:</strong> ${order.name}</p>
      <p><strong><i class="fas fa-phone"></i> الجوال:</strong> ${order.phone}</p>
      <p><strong><i class="fas fa-map-marker-alt"></i> العنوان:</strong> ${order.address}</p>
      <p><strong><i class="fas fa-calendar"></i> التاريخ:</strong> ${order.date}</p>
      ${itemsHtml}
      <p style="margin-top:15px; font-size:20px; color:#facc15"><strong>الإجمالي:</strong> ${order.total}$</p>
    `;
    modal.classList.add("active");
  }

  function closeModal() {
    document.getElementById("orderModal").classList.remove("active");
  }

  // تحديث المعلومات الشخصية
  function updateProfile() {
    const newName = document.getElementById("editName").value.trim();
    const newAddress = document.getElementById("editAddress").value.trim();

    if (!newName) {
      showToast("⚠️ الرجاء إدخال الاسم", "#f97316");
      return;
    }

    const updates = { name: newName, address: newAddress };
    
    database.ref('customers/' + currentCustomer.id).update(updates).then(() => {
      currentCustomer = { ...currentCustomer, ...updates };
      showProfile();
      showToast("✅ تم تحديث المعلومات بنجاح", "#10b981");
    });
  }

  // تغيير رقم الجوال (العودة للبحث)
  function changePhone() {
    document.getElementById("searchSection").style.display = "flex";
    document.getElementById("profileSection").style.display = "none";
    document.getElementById("searchPhone").value = "";
    currentCustomer = null;
    currentPhone = null;
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if (tab === 'orders') {
      document.querySelector('.tab:first-child').classList.add('active');
      document.getElementById('ordersTab').classList.add('active');
    } else {
      document.querySelector('.tab:last-child').classList.add('active');
      document.getElementById('infoTab').classList.add('active');
    }
  }

  function showToast(msg, color) {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
    toast.style.background = color;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  window.onclick = (e) => { 
    if (e.target === document.getElementById("orderModal")) closeModal(); 
  };
</script>
