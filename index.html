<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK STORE | المتجر الاحترافي</title>
  <!-- Firebase SDK v9 Modular (أفضل أداء) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    /* === نظام تصميم احترافي (Design System) === */
    :root {
      --primary: #8b5cf6;
      --primary-dark: #6d28d9;
      --secondary: #f472b6;
      --accent: #facc15;
      --danger: #ef4444;
      --success: #10b981;
      --bg-dark: #0a0a0a;
      --bg-card: #13131f;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-glow: rgba(139, 92, 246, 0.3);
      --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      direction: rtl;
      color: var(--text-primary);
      font-family: 'Poppins', 'Tahoma', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }

    /* Header احترافي */
    .header {
      background: rgba(10, 10, 18, 0.95);
      backdrop-filter: blur(12px);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-glow);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .nav-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    /* نظام البطاقات */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      padding: 3rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .product-card {
      background: linear-gradient(145deg, var(--bg-card), #0c0c16);
      border-radius: 1.5rem;
      overflow: hidden;
      transition: var(--transition-smooth);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      animation: fadeInUp 0.5s ease backwards;
    }

    .product-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--primary);
      box-shadow: var(--shadow-xl);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.05);
    }

    .product-info {
      padding: 1.5rem;
      text-align: center;
    }

    .product-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0.75rem 0;
    }

    /* أزرار احترافية */
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary);
      color: white;
    }

    /* أيقونة السلة */
    .cart-badge {
      background: rgba(30, 30, 45, 0.9);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.25rem;
      border-radius: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
      transition: var(--transition-smooth);
      border: 1px solid var(--border-glow);
      text-decoration: none;
      color: white;
    }

    .cart-count {
      background: linear-gradient(135deg, var(--danger), #dc2626);
      padding: 0.125rem 0.625rem;
      border-radius: 1.5rem;
      font-size: 0.875rem;
      font-weight: 700;
    }

    /* Toast Notifications */
    .toast-notification {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b2e;
      backdrop-filter: blur(20px);
      padding: 0.875rem 2rem;
      border-radius: 3rem;
      color: white;
      font-weight: 600;
      z-index: 1000;
      animation: slideUp 0.3s ease;
      border: 1px solid var(--border-glow);
      box-shadow: var(--shadow-xl);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* Loading Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #1a1a2a 25%, #2a2a3a 50%, #1a1a2a 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 1rem;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* رسبونسيف */
    @media (max-width: 768px) {
      .products-grid {
        padding: 1.5rem;
        gap: 1.25rem;
      }
      .header {
        padding: 1rem;
      }
      .logo {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">⚡ DARK STORE | احترافي</div>
  <div class="nav-actions">
    <a href="cart.html" class="cart-badge" id="cartButton">
      🛒 السلة
      <span class="cart-count" id="cartCount">0</span>
    </a>
    <a href="admin.html" class="btn btn-outline">📊 لوحة التحكم</a>
  </div>
</header>

<main>
  <div class="products-grid" id="productsContainer">
    <!-- Skeleton Loading سيظهر تلقائياً -->
  </div>
</main>

<script>
  // ==================== تهيئة Firebase بشكل آمن ====================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
    authDomain: "tok-tak-d6e17.firebaseapp.com",
    databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
    projectId: "tok-tak-d6e17",
    storageBucket: "tok-tak-d6e17.appspot.com",
    messagingSenderId: "547062578826",
    appId: "1:547062578826:web:aa285cf798341be07cb773"
  };

  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();

  // ==================== إدارة الحالة (State Management) ====================
  class AppState {
    constructor() {
      this.products = [];
      this.cart = [];
      this.listeners = [];
    }

    subscribe(listener) {
      this.listeners.push(listener);
      return () => {
        this.listeners = this.listeners.filter(l => l !== listener);
      };
    }

    notify() {
      this.listeners.forEach(listener => listener(this));
    }

    updateProducts(products) {
      this.products = products;
      this.notify();
    }

    updateCart(cart) {
      this.cart = cart;
      this.saveCartToLocal();
      this.notify();
    }

    saveCartToLocal() {
      localStorage.setItem('darkstore_cart', JSON.stringify(this.cart));
    }

    loadCartFromLocal() {
      const saved = localStorage.getItem('darkstore_cart');
      if (saved) {
        try {
          this.cart = JSON.parse(saved);
          this.notify();
        } catch (e) {
          console.error('فشل تحميل السلة', e);
        }
      }
    }
  }

  // ==================== نظام الإشعارات ====================
  class ToastService {
    static show(message, type = 'success') {
      const existing = document.querySelector('.toast-notification');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast-notification';
      toast.textContent = message;
      
      const colors = {
        success: '#10b981',
        error: '#ef4444',
        info: '#3b82f6'
      };
      
      toast.style.background = colors[type] || colors.success;
      toast.style.border = 'none';
      
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }
  }

  // ==================== إدارة المنتجات ====================
  class ProductManager {
    constructor(state) {
      this.state = state;
    }

    async loadProducts() {
      this.showSkeleton();
      
      return new Promise((resolve) => {
        const productsRef = db.ref('products');
        
        productsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          const products = [];
          
          if (data) {
            Object.entries(data).forEach(([id, product]) => {
              // التحقق من صحة البيانات
              if (product && typeof product === 'object') {
                products.push({
                  id,
                  name: product.name || 'منتج بدون اسم',
                  price: Number(product.price) || 0,
                  image: product.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400'
                });
              }
            });
          }
          
          this.state.updateProducts(products);
          this.renderProducts(products);
          resolve(products);
        }, (error) => {
          console.error('خطأ في تحميل المنتجات:', error);
          ToastService.show('فشل تحميل المنتجات', 'error');
          this.renderError();
          resolve([]);
        });
      });
    }

    renderProducts(products) {
      const container = document.getElementById('productsContainer');
      if (!container) return;

      if (!products || products.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem;">
            <p style="color: var(--text-secondary); font-size: 1.25rem;">📦 لا توجد منتجات حالياً</p>
            <small>قم بإضافة منتجات من لوحة التحكم</small>
          </div>
        `;
        return;
      }

      const fragment = document.createDocumentFragment();
      
      products.forEach((product, index) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.style.animationDelay = `${index * 0.05}s`;
        
        card.innerHTML = `
          <img 
            src="${product.image}" 
            alt="${this.escapeHtml(product.name)}"
            class="product-image"
            loading="lazy"
            onerror="this.src='https://via.placeholder.com/400x260?text=Product+Image'"
          >
          <div class="product-info">
            <h3 class="product-title">${this.escapeHtml(product.name)}</h3>
            <div class="product-price">💰 ${product.price.toFixed(2)} $</div>
            <button class="btn btn-primary" data-product='${JSON.stringify(product)}'>
              ➕ إضافة للسلة
            </button>
          </div>
        `;
        
        const addButton = card.querySelector('.btn-primary');
        addButton.addEventListener('click', (e) => {
          e.stopPropagation();
          this.handleAddToCart(product);
        });
        
        fragment.appendChild(card);
      });
      
      container.innerHTML = '';
      container.appendChild(fragment);
    }

    handleAddToCart(product) {
      const cartManager = new CartManager(this.state);
      cartManager.addItem(product);
    }

    escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    showSkeleton() {
      const container = document.getElementById('productsContainer');
      if (!container) return;
      
      container.innerHTML = Array(6).fill(0).map(() => `
        <div class="product-card">
          <div class="skeleton" style="height: 260px;"></div>
          <div class="product-info">
            <div class="skeleton" style="height: 28px; width: 70%; margin: 0 auto 0.5rem;"></div>
            <div class="skeleton" style="height: 32px; width: 40%; margin: 0.5rem auto;"></div>
            <div class="skeleton" style="height: 42px; width: 60%; margin: 0 auto;"></div>
          </div>
        </div>
      `).join('');
    }

    renderError() {
      const container = document.getElementById('productsContainer');
      if (container) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem;">
            <p style="color: var(--danger); font-size: 1.25rem;">⚠️ حدث خطأ في تحميل المنتجات</p>
            <button class="btn btn-primary" onclick="location.reload()">🔄 إعادة المحاولة</button>
          </div>
        `;
      }
    }
  }

  // ==================== إدارة السلة ====================
  class CartManager {
    constructor(state) {
      this.state = state;
    }

    addItem(product) {
      const currentCart = [...this.state.cart];
      const existingIndex = currentCart.findIndex(item => item.id === product.id);
      
      if (existingIndex !== -1) {
        currentCart[existingIndex].quantity += 1;
        ToastService.show(`✨ تم زيادة كمية ${product.name} إلى ${currentCart[existingIndex].quantity}`, 'success');
      } else {
        currentCart.push({
          id: product.id,
          name: product.name,
          price: product.price,
          quantity: 1,
          image: product.image
        });
        ToastService.show(`✨ تم إضافة ${product.name} إلى السلة`, 'success');
      }
      
      this.state.updateCart(currentCart);
      this.updateCartUI();
    }

    removeItem(productId) {
      const currentCart = this.state.cart.filter(item => item.id !== productId);
      this.state.updateCart(currentCart);
      ToastService.show('🗑️ تم حذف المنتج من السلة', 'info');
      this.updateCartUI();
    }

    updateQuantity(productId, delta) {
      const currentCart = [...this.state.cart];
      const itemIndex = currentCart.findIndex(item => item.id === productId);
      
      if (itemIndex !== -1) {
        const newQuantity = currentCart[itemIndex].quantity + delta;
        
        if (newQuantity <= 0) {
          this.removeItem(productId);
        } else {
          currentCart[itemIndex].quantity = newQuantity;
          this.state.updateCart(currentCart);
          this.updateCartUI();
        }
      }
    }

    clearCart() {
      this.state.updateCart([]);
      ToastService.show('🧹 تم تفريغ السلة بالكامل', 'info');
      this.updateCartUI();
    }

    updateCartUI() {
      const cartCountSpan = document.getElementById('cartCount');
      if (cartCountSpan) {
        const totalItems = this.state.cart.reduce((sum, item) => sum + item.quantity, 0);
        cartCountSpan.textContent = totalItems;
      }
      
      // تحديث واجهة السلة إذا كنا في صفحة cart.html
      if (window.location.pathname.includes('cart.html')) {
        this.renderCartPage();
      }
    }

    getTotalPrice() {
      return this.state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    }

    renderCartPage() {
      const container = document.getElementById('cartContainer');
      if (!container) return;
      
      if (this.state.cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            🛒 سلة المشتريات فارغة
            <a href="index.html" class="btn btn-primary" style="display: inline-block; margin-top: 1rem;">تسوق الآن</a>
          </div>
        `;
        return;
      }
      
      container.innerHTML = `
        <div class="cart-container">
          <h2>🛍️ سلة المشتريات</h2>
          <div class="cart-items" id="cartItemsList"></div>
          <div class="cart-footer">
            <div class="total">المجموع: <strong>${this.getTotalPrice().toFixed(2)} $</strong></div>
            <button class="btn btn-danger" id="clearCartBtn">🗑️ تفريغ السلة</button>
          </div>
        </div>
      `;
      
      const itemsContainer = document.getElementById('cartItemsList');
      if (itemsContainer) {
        this.state.cart.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'cart-item';
          itemDiv.innerHTML = `
            <div class="cart-item-info">
              <span class="cart-item-name">${this.escapeHtml(item.name)}</span>
              <span class="cart-item-price">${item.price.toFixed(2)} $</span>
            </div>
            <div class="cart-item-controls">
              <button class="btn-quantity" data-id="${item.id}" data-delta="-1">-</button>
              <span class="cart-item-quantity">${item.quantity}</span>
              <button class="btn-quantity" data-id="${item.id}" data-delta="1">+</button>
              <button class="btn-remove" data-id="${item.id}">✖ حذف</button>
            </div>
          `;
          itemsContainer.appendChild(itemDiv);
        });
        
        // إضافة أحداث الأزرار
        document.querySelectorAll('.btn-quantity').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = btn.dataset.id;
            const delta = parseInt(btn.dataset.delta);
            this.updateQuantity(id, delta);
          });
        });
        
        document.querySelectorAll('.btn-remove').forEach(btn => {
          btn.addEventListener('click', (e) => {
            this.removeItem(btn.dataset.id);
          });
        });
        
        document.getElementById('clearCartBtn')?.addEventListener('click', () => this.clearCart());
      }
    }

    escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  }

  // ==================== تشغيل التطبيق ====================
  const appState = new AppState();
  const productManager = new ProductManager(appState);
  const cartManager = new CartManager(appState);
  
  // تحميل السلة من localStorage
  appState.loadCartFromLocal();
  
  // تحميل المنتجات
  productManager.loadProducts();
  
  // تحديث واجهة السلة عند أي تغيير
  appState.subscribe(() => {
    cartManager.updateCartUI();
  });
  
  // إضافة cartManager للنطاق العام للاستخدام في الصفحات الأخرى
  window.cartManager = cartManager;
  window.productManager = productManager;
</script>
</body>
</html>
