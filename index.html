<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر إلكتروني احترافي | المتجر الرئيسي</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Tahoma', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #0a0a0a;
      direction: rtl;
      color: #e0e0e0;
    }

    header {
      background: #0a0a12;
      backdrop-filter: blur(10px);
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    header h1 {
      font-size: 28px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }

    .admin-link {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      padding: 10px 25px;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      font-size: 14px;
    }

    .admin-link:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    .cart-icon {
      font-size: 24px;
      background: rgba(30, 30, 45, 0.8);
      padding: 10px 22px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.25s;
      font-weight: bold;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-decoration: none;
      color: white;
    }

    .cart-icon:hover {
      background: #1e1e2f;
      transform: scale(1.02);
    }

    .cart-icon span {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: bold;
    }

    /* المنتجات */
    .products {
      padding: 50px 35px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 40px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .card {
      background: linear-gradient(145deg, #13131f, #0c0c16);
      border-radius: 32px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card:hover {
      transform: translateY(-12px);
      box-shadow: 0 30px 45px rgba(0, 0, 0, 0.5);
      border-color: rgba(139, 92, 246, 0.3);
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      transition: transform 0.6s;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .card h3 {
      margin: 22px 0 8px;
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .card p {
      color: #c084fc;
      font-size: 22px;
      font-weight: 700;
      margin: 8px 0;
    }

    .card button {
      margin: 18px 0 28px;
      padding: 12px 32px;
      border: none;
      background: linear-gradient(95deg, #8b5cf6, #6d28d9);
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .card button:hover {
      background: linear-gradient(95deg, #9b6eff, #7c3aed);
      transform: scale(1.03);
    }

    /* صفحة السلة */
    .cart-page {
      min-height: calc(100vh - 80px);
      padding: 40px;
    }

    .cart-container {
      background: rgba(18, 18, 30, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 32px 35px;
      max-width: 1200px;
      margin: 0 auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .cart-container h2 {
      font-size: 32px;
      margin-bottom: 25px;
      color: #f0f0ff;
      border-right: 5px solid #a855f7;
      padding-right: 20px;
    }

    .cart-items-list {
      list-style: none;
      margin: 25px 0;
      max-height: 500px;
      overflow-y: auto;
    }

    .cart-items-list::-webkit-scrollbar {
      width: 6px;
    }

    .cart-items-list::-webkit-scrollbar-track {
      background: #1e1e2a;
      border-radius: 10px;
    }

    .cart-items-list::-webkit-scrollbar-thumb {
      background: #a855f7;
      border-radius: 10px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: rgba(0, 0, 0, 0.3);
      margin: 10px 0;
      border-radius: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .cart-item-info {
      display: flex;
      gap: 25px;
      align-items: center;
      flex-wrap: wrap;
    }

    .cart-item-name {
      font-size: 20px;
      font-weight: 600;
    }

    .cart-item-price {
      color: #c084fc;
      font-size: 18px;
      font-weight: bold;
    }

    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-btn {
      background: #2d2d44;
      border: none;
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    .quantity-btn:hover {
      background: #8b5cf6;
    }

    .cart-item-qty {
      font-size: 18px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }

    .remove-item-btn {
      background: linear-gradient(145deg, #dc2626, #991b1b);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }

    .remove-item-btn:hover {
      background: #b91c1c;
      transform: scale(0.96);
    }

    .cart-summary {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px solid rgba(139, 92, 246, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .total-price {
      font-size: 32px;
      color: #facc15;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 32px;
      border-radius: 60px;
      font-weight: 800;
    }

    .clear-cart-btn {
      background: #2d2d44;
      border: 1px solid rgba(255, 100, 100, 0.3);
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      color: white;
    }

    .clear-cart-btn:hover {
      background: #3a3a5a;
      transform: translateY(-2px);
    }

    .empty-cart {
      text-align: center;
      padding: 60px;
      color: #9ca3af;
      font-size: 20px;
    }

    .back-to-store {
      display: inline-block;
      margin-top: 20px;
      background: #2d2d44;
      padding: 12px 25px;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      transition: 0.2s;
    }

    .back-to-store:hover {
      background: #3a3a5a;
    }

    .toast {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b2e;
      backdrop-filter: blur(20px);
      color: white;
      padding: 14px 32px;
      border-radius: 60px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      animation: slideUpFade 0.4s ease forwards;
      z-index: 1000;
      font-weight: 600;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #c084fc;
    }

    @media (max-width: 750px) {
      .products {
        padding: 30px 20px;
        gap: 25px;
      }
      header {
        padding: 15px 20px;
      }
      header h1 {
        font-size: 18px;
      }
      .cart-item {
        flex-direction: column;
        text-align: center;
      }
      .cart-summary {
        flex-direction: column;
      }
      .cart-page {
        padding: 20px;
      }
      .cart-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>🖤 DARK STORE | متجر احترافي</h1>
  <div style="display: flex; gap: 15px;">
    <a href="cart.html" class="cart-icon">
      🛍️ سلة المشتريات <span id="cartCount">0</span>
    </a>
    <a href="admin.html" class="admin-link">📊 لوحة التحكم</a>
  </div>
</header>

<div class="products" id="productsContainer">
  <div class="loading">جاري تحميل المنتجات...</div>
</div>

<script>
  // تهيئة Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
    authDomain: "tok-tak-d6e17.firebaseapp.com",
    databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
    projectId: "tok-tak-d6e17",
    storageBucket: "tok-tak-d6e17.appspot.com",
    messagingSenderId: "547062578826",
    appId: "1:547062578826:web:aa285cf798341be07cb773",
    measurementId: "G-7EMKEQKPVV"
  };
  
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  
  let cart = [];
  let products = [];

  // تحميل المنتجات من Firebase
  function loadProductsFromFirebase() {
    database.ref('products').on('value', (snapshot) => {
      const data = snapshot.val();
      products = [];
      if (data) {
        Object.keys(data).forEach(key => {
          products.push({ id: key, ...data[key] });
        });
      }
      displayProducts();
    });
  }

  // عرض المنتجات
  function displayProducts() {
    const container = document.getElementById("productsContainer");
    if (!container) return;
    container.innerHTML = "";
    
    if (products.length === 0) {
      container.innerHTML = "<p style='text-align:center; color:#9ca3af; padding:50px;'>📦 لا توجد منتجات حالياً. أضف منتجات من لوحة التحكم!</p>";
      return;
    }
    
    products.forEach(product => {
      const card = document.createElement("div");
      card.className = "card";
      const imgUrl = product.image || "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600";
      card.innerHTML = `
        <img src="${imgUrl}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/300?text=Product'">
        <h3>${product.name}</h3>
        <p>💎 ${product.price}$</p>
        <button onclick="addToCart('${product.name.replace(/'/g, "\\'")}', ${product.price})">➕ أضف للسلة</button>
      `;
      container.appendChild(card);
    });
  }

  // إضافة منتج إلى السلة
  function addToCart(name, price) {
    const existingItem = cart.find(item => item.name === name);
    if (existingItem) {
      existingItem.quantity += 1;
      showToast(`✨ تم زيادة كمية ${name} إلى ${existingItem.quantity} ✨`, "#10b981");
    } else {
      cart.push({ name, price, quantity: 1 });
      showToast(`✨ تم إضافة ${name} إلى السلة ✨`, "#10b981");
    }
    updateCartCount();
    saveCartToLocalStorage();
  }

  // تحديث عدد المنتجات في أيقونة السلة
  function updateCartCount() {
    const cartCountSpan = document.getElementById("cartCount");
    if (cartCountSpan) {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCountSpan.innerText = totalItems;
    }
  }

  // حفظ السلة في localStorage
  function saveCartToLocalStorage() {
    localStorage.setItem("darkStoreCart", JSON.stringify(cart));
  }

  // تحميل السلة من localStorage
  function loadCartFromLocalStorage() {
    const savedCart = localStorage.getItem("darkStoreCart");
    if (savedCart) {
      try {
        cart = JSON.parse(savedCart);
        updateCartCount();
      } catch(e) {}
    }
  }

  // رسائل منبثقة
  function showToast(message, bgColor) {
    const oldToast = document.querySelector(".toast");
    if (oldToast) oldToast.remove();
    
    let toast = document.createElement("div");
    toast.className = "toast";
    toast.innerText = message;
    toast.style.background = bgColor;
    document.body.appendChild(toast);
    
    setTimeout(() => {
      if (toast && toast.remove) toast.remove();
    }, 2500);
  }

  // تحميل البيانات
  loadProductsFromFirebase();
  loadCartFromLocalStorage();
</script>
</body>
</html>
