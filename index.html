<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة حجز الامتحانات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 35px 45px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-logo .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2.5rem;
            color: white;
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }
        .login-logo h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #1a1a2e;
        }
        .login-logo h1 span {
            color: #667eea;
        }
        .login-logo p {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 4px;
        }
        .demo-credentials {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #475569;
            border: 1px dashed #94a3b8;
        }
        .demo-credentials strong {
            color: #667eea;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-group label i {
            color: #667eea;
            margin-left: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            transition: 0.3s;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background: white;
        }
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 22px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #475569;
            cursor: pointer;
        }
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }
        .forgot-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
        }
        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
        }
        .btn-login:active {
            transform: scale(0.97);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 0.95rem;
        }
        .register-link a {
            color: #667eea;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            padding: 16px 24px;
            border-radius: 14px;
            background: #1e293b;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 14px;
            transform: translateX(120%);
            transition: 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            max-width: 400px;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast.success {
            background: linear-gradient(135deg, #065f46, #047857);
        }
        .toast.error {
            background: linear-gradient(135deg, #991b1b, #dc2626);
        }
        .toast.warning {
            background: linear-gradient(135deg, #92400e, #d97706);
        }
        .toast i {
            font-size: 1.5rem;
        }
        .toast .close-toast {
            margin-right: auto;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .toast .close-toast:hover {
            color: white;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px 32px;
            }
            .login-logo .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }
            .login-logo h1 {
                font-size: 1.4rem;
            }
            .toast {
                right: 16px;
                left: 16px;
                max-width: none;
                bottom: 16px;
                font-size: 0.85rem;
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <h1>منصة <span>الامتحانات</span></h1>
                <p>تسجيل الدخول إلى حسابك</p>
            </div>

            <div class="demo-credentials">
                <i class="fas fa-info-circle" style="color:#667eea;"></i>
                للاختبار: <strong>student@example.com</strong> / <strong>password123</strong>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="example@email.com" value="student@example.com" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" value="password123" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked> تذكرني
                    </label>
                    <span class="forgot-link" onclick="showToast('📧 سيتم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني', 'warning')">نسيت كلمة المرور؟</span>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-arrow-left"></i> تسجيل الدخول
                </button>
            </form>

            <div class="register-link">
                ليس لديك حساب؟ <span onclick="showToast('📝 سيتم توجيهك إلى صفحة التسجيل', 'warning')" style="color:#667eea;font-weight:700;cursor:pointer;">إنشاء حساب جديد</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-circle-check" id="toastIcon"></i>
        <span id="toastMessage">تم تسجيل الدخول بنجاح</span>
        <button class="close-toast" onclick="closeToast()"><i class="fas fa-times"></i></button>
    </div>

    <script>
        // ============================================
        // SIMPLE AUTHENTICATION SYSTEM
        // باستخدام LocalStorage بدلاً من Firebase Auth
        // ============================================

        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');
        let toastTimeout;

        // ============================================
        // TOAST NOTIFICATIONS
        // ============================================
        function showToast(message, type = 'success') {
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-xmark',
                warning: 'fa-triangle-exclamation'
            };
            toast.className = `toast ${type}`;
            toastIcon.className = `fas ${icons[type] || icons.success}`;
            toastMessage.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            toast.classList.remove('show');
            clearTimeout(toastTimeout);
        }

        // ============================================
        // USERS DATABASE (LocalStorage)
        // ============================================
        function getUsers() {
            const users = localStorage.getItem('exam_users');
            return users ? JSON.parse(users) : {};
        }

        function saveUsers(users) {
            localStorage.setItem('exam_users', JSON.stringify(users));
        }

        // Create default users if none exist
        function initUsers() {
            const users = getUsers();
            if (Object.keys(users).length === 0) {
                users['student@example.com'] = {
                    password: 'password123',
                    name: 'أحمد محمد',
                    class: '٣ث / علمي',
                    school: 'مدرسة النخبة',
                    phone: '٠١٠٠٢٢٣٣٤٤٥',
                    role: 'student'
                };
                saveUsers(users);
            }
        }

        // ============================================
        // LOGIN FUNCTION
        // ============================================
        function loginUser(email, password) {
            const users = getUsers();
            const user = users[email];

            if (!user) {
                return { success: false, message: '⚠️ هذا البريد غير مسجل' };
            }

            if (user.password !== password) {
                return { success: false, message: '⚠️ كلمة المرور غير صحيحة' };
            }

            // Save session
            const session = {
                email: email,
                name: user.name,
                class: user.class,
                school: user.school,
                phone: user.phone,
                role: user.role || 'student',
                loginTime: Date.now()
            };
            localStorage.setItem('exam_session', JSON.stringify(session));

            return { success: true, message: '✅ تم تسجيل الدخول بنجاح!', user: session };
        }

        // ============================================
        // REGISTER FUNCTION (Create new account)
        // ============================================
        function registerUser(email, password, name) {
            const users = getUsers();

            if (users[email]) {
                return { success: false, message: '⚠️ هذا البريد مسجل مسبقاً' };
            }

            users[email] = {
                password: password,
                name: name || 'طالب جديد',
                class: '',
                school: '',
                phone: '',
                role: 'student'
            };
            saveUsers(users);

            return { success: true, message: '✅ تم إنشاء الحساب بنجاح!' };
        }

        // ============================================
        // CHECK SESSION (Auto-login)
        // ============================================
        function checkSession() {
            const session = localStorage.getItem('exam_session');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    // Check if session is still valid (24 hours)
                    if (Date.now() - data.loginTime < 24 * 60 * 60 * 1000) {
                        return data;
                    } else {
                        localStorage.removeItem('exam_session');
                    }
                } catch (e) {
                    localStorage.removeItem('exam_session');
                }
            }
            return null;
        }

        // ============================================
        // LOGOUT FUNCTION
        // ============================================
        function logoutUser() {
            localStorage.removeItem('exam_session');
            showToast('👋 تم تسجيل الخروج', 'warning');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showToast('⚠️ الرجاء إدخال البريد الإلكتروني وكلمة المرور', 'error');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner"></span> جاري الدخول...';
            btn.disabled = true;

            // Simulate network delay
            setTimeout(() => {
                const result = loginUser(email, password);

                if (result.success) {
                    showToast(result.message, 'success');
                    setTimeout(() => {
                        window.location.href = 'booking.html';
                    }, 1500);
                } else {
                    showToast(result.message, 'error');
                    btn.innerHTML = '<i class="fas fa-arrow-left"></i> تسجيل الدخول';
                    btn.disabled = false;
                }
            }, 800);
        });

        // ============================================
        // CREATE ACCOUNT (Demo)
        // ============================================
        function createDemoAccount() {
            const result = registerUser('demo@example.com', 'demo123', 'مستخدم تجريبي');
            if (result.success) {
                showToast(result.message, 'success');
            } else {
                showToast(result.message, 'warning');
            }
        }

        // ============================================
        // INIT
        // ============================================
        function init() {
            initUsers();

            // Check if already logged in
            const session = checkSession();
            if (session) {
                window.location.href = 'booking.html';
            }

            // For demo: Create demo account on first load
            const users = getUsers();
            if (!users['demo@example.com']) {
                createDemoAccount();
            }

            console.log('📚 مستخدمين متاحين للتسجيل:');
            const allUsers = getUsers();
            Object.keys(allUsers).forEach(email => {
                console.log(`   📧 ${email} / 🔑 ${allUsers[email].password}`);
            });
            console.log('✅ نظام تسجيل الدخول يعمل باستخدام LocalStorage');
        }

        // Start
        init();

        // Make functions available globally
        window.showToast = showToast;
        window.closeToast = closeToast;
        window.logoutUser = logoutUser;
        window.checkSession = checkSession;
        window.getUsers = getUsers;
        window.registerUser = registerUser;
    </script>
</body>
    </html>
