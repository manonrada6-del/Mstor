<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز الامتحانات | منصة حجز الامتحانات</title>
    <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .app-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            padding: 16px 24px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-brand .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
        }
        .header-brand h1 {
            font-size: 1.4rem;
            font-weight: 900;
            color: #1a1a2e;
        }
        .header-brand h1 span {
            color: #667eea;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: #f1f5f9;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
        }
        .user-badge i {
            color: #667eea;
        }
        .btn-logout {
            padding: 8px 18px;
            border: 2px solid #dc2626;
            border-radius: 50px;
            background: transparent;
            color: #dc2626;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .btn-logout:hover {
            background: #dc2626;
            color: white;
        }
        .btn-profile {
            padding: 8px 18px;
            border: 2px solid #667eea;
            border-radius: 50px;
            background: transparent;
            color: #667eea;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-profile:hover {
            background: #667eea;
            color: white;
        }
        .student-profile {
            background: white;
            border-radius: 20px;
            padding: 20px 28px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 32px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
        }
        .profile-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .profile-info {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 28px;
            flex: 1;
        }
        .profile-info .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 0.95rem;
        }
        .profile-info .info-item i {
            color: #667eea;
            width: 20px;
            text-align: center;
        }
        .profile-info .info-item span {
            font-weight: 400;
            color: #475569;
        }
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 28px;
        }
        .subject-card {
            background: white;
            border-radius: 20px;
            padding: 24px 22px 22px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            transition: 0.3s;
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .subject-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }
        .subject-card .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .subject-card .card-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #667eea;
        }
        .subject-card .status-badge {
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .status-badge.available {
            background: #e2e8f0;
            color: #475569;
        }
        .status-badge.booked {
            background: #f0fdf4;
            color: #16a34a;
        }
        .status-badge.pending {
            background: #fffbeb;
            color: #f59e0b;
        }
        .subject-card h3 {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .subject-card .subject-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f1f5f9;
        }
        .subject-card .subject-meta i {
            color: #667eea;
            margin-left: 4px;
        }
        .subject-card .exam-date {
            background: #f8fafc;
            padding: 10px 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .subject-card .exam-date i {
            color: #667eea;
        }
        .btn-book {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.3);
        }
        .btn-book:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }
        .btn-book:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .btn-book.booked {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
        }
        .btn-book.pending {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
        }
        .summary-bar {
            background: white;
            border-radius: 20px;
            padding: 18px 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
        }
        .summary-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 32px;
        }
        .summary-stats .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: #334155;
        }
        .summary-stats .stat i {
            font-size: 1.3rem;
            color: #667eea;
            width: 28px;
            text-align: center;
        }
        .summary-stats .stat .stat-value {
            background: #f1f5f9;
            padding: 2px 16px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            color: #1a1a2e;
            min-width: 32px;
            text-align: center;
        }
        .summary-stats .stat .stat-value.booked-value {
            background: #f0fdf4;
            color: #16a34a;
        }
        .summary-stats .stat .stat-value.pending-value {
            background: #fffbeb;
            color: #f59e0b;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            padding: 16px 24px;
            border-radius: 14px;
            background: #1e293b;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 14px;
            transform: translateX(120%);
            transition: 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            max-width: 400px;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast.success {
            background: linear-gradient(135deg, #065f46, #047857);
        }
        .toast.error {
            background: linear-gradient(135deg, #991b1b, #dc2626);
        }
        .toast.warning {
            background: linear-gradient(135deg, #92400e, #d97706);
        }
        .toast i {
            font-size: 1.5rem;
        }
        .toast .close-toast {
            margin-right: auto;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .toast .close-toast:hover {
            color: white;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        .loading-spinner .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-spinner p {
            color: #334155;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .app-header {
                padding: 12px 16px;
            }
            .header-brand h1 {
                font-size: 1.1rem;
            }
            .student-profile {
                padding: 16px 18px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .profile-avatar {
                align-self: center;
            }
            .profile-info {
                justify-content: center;
                gap: 8px 16px;
            }
            .subjects-grid {
                grid-template-columns: 1fr;
            }
            .summary-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 16px 18px;
            }
            .summary-stats {
                justify-content: center;
            }
            .toast {
                right: 16px;
                left: 16px;
                max-width: none;
                bottom: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>جاري تحميل المواد...</p>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <h1>حجز <span>الامتحانات</span></h1>
            </div>
            <div class="header-actions">
                <div class="user-badge"><i class="fas fa-user-circle"></i> <span id="userName">مرحباً، طالب</span></div>
                <a href="profile.html" class="btn-profile"><i class="fas fa-user-edit"></i> الملف</a>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </header>

        <!-- Student Profile -->
        <div class="student-profile">
            <div class="profile-avatar" id="profileAvatar">أ</div>
            <div class="profile-info">
                <div class="info-item"><i class="fas fa-user-graduate"></i> <span id="studentName">أحمد محمد</span></div>
                <div class="info-item"><i class="fas fa-id-card"></i> <span id="studentClass">٣ث / علمي</span></div>
                <div class="info-item"><i class="fas fa-school"></i> <span id="studentSchool">مدرسة النخبة</span></div>
                <div class="info-item"><i class="fas fa-phone"></i> <span id="studentPhone">٠١٠٠٢٢٣٣٤٤٥</span></div>
            </div>
        </div>

        <!-- Subjects Grid -->
        <div class="subjects-grid" id="subjectsGrid">
            <div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8;">
                <i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i>
                <p style="margin-top:12px;">جاري تحميل المواد...</p>
            </div>
        </div>

        <!-- Summary -->
        <div class="summary-bar">
            <div class="summary-stats">
                <div class="stat"><i class="fas fa-book-open"></i> <span>إجمالي</span> <span class="stat-value" id="totalCount">0</span></div>
                <div class="stat"><i class="fas fa-check-circle"></i> <span>محجوز</span> <span class="stat-value booked-value" id="bookedCount">0</span></div>
                <div class="stat"><i class="fas fa-clock"></i> <span>متبقي</span> <span class="stat-value" id="remainingCount">0</span></div>
                <div class="stat"><i class="fas fa-hourglass-half"></i> <span>قيد الانتظار</span> <span class="stat-value pending-value" id="pendingCount">0</span></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-circle-check" id="toastIcon"></i>
        <span id="toastMessage">تم الحجز بنجاح</span>
        <button class="close-toast" onclick="closeToast()"><i class="fas fa-times"></i></button>
    </div>

    <script>
        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
            authDomain: "tok-tak-d6e17.firebaseapp.com",
            databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
            projectId: "tok-tak-d6e17",
            storageBucket: "tok-tak-d6e17.appspot.com",
            messagingSenderId: "547062578826",
            appId: "1:547062578826:web:aa285cf798341be07cb773"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ============================================
        // DATA
        // ============================================
        const subjectsData = [
            { id: 1, name: 'اللغة العربية', icon: 'fa-book', date: '2026-06-15', time: '09:00 ص', price: 150 },
            { id: 2, name: 'اللغة الإنجليزية', icon: 'fa-language', date: '2026-06-17', time: '11:00 ص', price: 150 },
            { id: 3, name: 'الرياضيات', icon: 'fa-calculator', date: '2026-06-19', time: '09:00 ص', price: 150 },
            { id: 4, name: 'الفيزياء', icon: 'fa-flask', date: '2026-06-21', time: '10:00 ص', price: 150 },
            { id: 5, name: 'الكيمياء', icon: 'fa-vial', date: '2026-06-23', time: '09:00 ص', price: 150 },
            { id: 6, name: 'الأحياء', icon: 'fa-dna', date: '2026-06-25', time: '11:00 ص', price: 150 },
        ];

        // ============================================
        // STATE
        // ============================================
        let currentUser = null;
        let bookingsData = [];
        let isLoading = true;

        // ============================================
        // DOM REFS
        // ============================================
        const grid = document.getElementById('subjectsGrid');
        const totalCountEl = document.getElementById('totalCount');
        const bookedCountEl = document.getElementById('bookedCount');
        const remainingCountEl = document.getElementById('remainingCount');
        const pendingCountEl = document.getElementById('pendingCount');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const toastIcon = document.getElementById('toastIcon');
        const loadingOverlay = document.getElementById('loadingOverlay');

        let toastTimeout;

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success') {
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-xmark',
                warning: 'fa-triangle-exclamation'
            };
            toast.className = `toast ${type}`;
            toastIcon.className = `fas ${icons[type] || icons.success}`;
            toastMessage.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeToast() {
            toast.classList.remove('show');
            clearTimeout(toastTimeout);
        }

        // ============================================
        // SESSION MANAGEMENT
        // ============================================
        function getSession() {
            const session = localStorage.getItem('exam_session');
            return session ? JSON.parse(session) : null;
        }

        function logout() {
            localStorage.removeItem('exam_session');
            window.location.href = 'login.html';
        }

        // ============================================
        // LOAD BOOKINGS FROM FIREBASE
        // ============================================
        function loadBookings(userEmail) {
            const userKey = userEmail.replace(/[.#$\/\[\]]/g, '_');
            const bookingsRef = database.ref(`bookings/${userKey}`);

            bookingsRef.on('value', snapshot => {
                const data = snapshot.val();
                bookingsData = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        bookingsData.push({ id: key, ...data[key] });
                    });
                }
                renderSubjects();
                isLoading = false;
                loadingOverlay.classList.remove('active');
            }, error => {
                console.error('Error loading bookings:', error);
                showToast('⚠️ خطأ في تحميل الحجوزات', 'error');
                isLoading = false;
                loadingOverlay.classList.remove('active');
                // Load from localStorage as fallback
                loadBookingsFromLocal();
            });
        }

        // ============================================
        // LOCAL FALLBACK
        // ============================================
        function loadBookingsFromLocal() {
            const local = localStorage.getItem('bookings_local');
            if (local) {
                bookingsData = JSON.parse(local);
            }
            renderSubjects();
        }

        function saveBookingsLocal() {
            localStorage.setItem('bookings_local', JSON.stringify(bookingsData));
        }

        // ============================================
        // GET BOOKING STATUS
        // ============================================
        function getBookingStatus(subjectId) {
            const booking = bookingsData.find(b => b.subjectId === subjectId);
            if (!booking) return 'available';
            return booking.status || 'pending';
        }

        function getBooking(subjectId) {
            return bookingsData.find(b => b.subjectId === subjectId);
        }

        // ============================================
        // RENDER SUBJECTS
        // ============================================
        function renderSubjects() {
            const total = subjectsData.length;
            const booked = bookingsData.filter(b => b.status === 'approved').length;
            const pending = bookingsData.filter(b => b.status === 'pending').length;
            const remaining = total - booked - pending;

            totalCountEl.textContent = total;
            bookedCountEl.textContent = booked;
            remainingCountEl.textContent = remaining;
            pendingCountEl.textContent = pending;

            let html = '';
            subjectsData.forEach((subj, index) => {
                const status = getBookingStatus(subj.id);
                const isBooked = status === 'approved';
                const isPending = status === 'pending';
                const dateObj = new Date(subj.date + 'T00:00:00');
                const formattedDate = dateObj.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });

                let statusText = 'متاح';
                let statusClass = 'available';
                let btnClass = '';
                let btnText = '<i class="fas fa-pen"></i> احجز الآن';
                let disabled = false;
                let btnAction = `onclick="bookSubject(${subj.id})"`;

                if (isBooked) {
                    statusText = 'محجوز ✓';
                    statusClass = 'booked';
                    btnClass = 'booked';
                    btnText = '<i class="fas fa-check-circle"></i> تم الحجز';
                    disabled = true;
                    btnAction = '';
                } else if (isPending) {
                    statusText = 'قيد الانتظار';
                    statusClass = 'pending';
                    btnClass = 'pending';
                    btnText = '<i class="fas fa-hourglass-half"></i> قيد المراجعة';
                    disabled = true;
                    btnAction = '';
                }

                html += `
                    <div class="subject-card" style="animation-delay:${(index * 0.05).toFixed(2)}s">
                        <div class="card-header">
                            <div class="card-icon"><i class="fas ${subj.icon}"></i></div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <h3>${subj.name}</h3>
                        <div class="subject-meta">
                            <span><i class="fas fa-calendar-day"></i> ${formattedDate}</span>
                            <span><i class="fas fa-clock"></i> ${subj.time}</span>
                            <span><i class="fas fa-money-bill-wave"></i> ${subj.price} ج.م</span>
                        </div>
                        <div class="exam-date">
                            <i class="fas fa-stopwatch"></i> الامتحان: ${formattedDate} · ${subj.time}
                        </div>
                        <button class="btn-book ${btnClass}" ${disabled ? 'disabled' : ''} ${btnAction}>
                            ${btnText}
                        </button>
                    </div>
                `;
            });

            grid.innerHTML = html;
            saveBookingsLocal();
        }

        // ============================================
        // BOOK SUBJECT
        // ============================================
        function bookSubject(subjectId) {
            const session = getSession();
            if (!session) {
                showToast('⚠️ الرجاء تسجيل الدخول أولاً', 'error');
                return;
            }

            const subject = subjectsData.find(s => s.id === subjectId);
            if (!subject) return;

            const existing = getBooking(subjectId);
            if (existing && existing.status === 'pending') {
                showToast('⏳ هذا الطلب قيد المراجعة', 'warning');
                return;
            }
            if (existing && existing.status === 'approved') {
                showToast('✅ هذا الامتحان محجوز بالفعل', 'warning');
                return;
            }

            if (confirm(`هل أنت متأكد من حجز "${subject.name}"؟\nالمبلغ: ${subject.price} ج.م`)) {
                const userKey = session.email.replace(/[.#$\/\[\]]/g, '_');
                const bookingRef = database.ref(`bookings/${userKey}`).push();

                const bookingData = {
                    subjectId: subject.id,
                    subjectName: subject.name,
                    date: subject.date,
                    time: subject.time,
                    price: subject.price,
                    status: 'pending',
                    createdAt: Date.now(),
                    studentName: session.name || 'طالب'
                };

                bookingRef.set(bookingData)
                    .then(() => {
                        showToast(`⏳ تم إرسال طلب حجز "${subject.name}" للمراجعة`, 'warning');
                        showToast('💳 يرجى التوجه إلى صفحة الدفع لإكمال العملية', 'warning');
                        setTimeout(() => {
                            window.location.href = 'payment.html';
                        }, 2000);
                    })
                    .catch(err => {
                        console.error('Error booking:', err);
                        showToast('❌ حدث خطأ في الحجز', 'error');
                        // Save locally as fallback
                        bookingData.id = 'local_' + Date.now();
                        bookingsData.push(bookingData);
                        renderSubjects();
                    });
            }
        }

        // ============================================
        // INIT
        // ============================================
        function init() {
            // Show loading
            loadingOverlay.classList.add('active');

            // Get session
            const session = getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = session;

            // Update UI
            document.getElementById('userName').textContent = `مرحباً، ${session.name || 'طالب'}`;
            document.getElementById('profileAvatar').textContent = (session.name || 'طالب')[0];
            document.getElementById('studentName').textContent = session.name || 'أحمد محمد';
            document.getElementById('studentClass').textContent = session.class || '٣ث / علمي';
            document.getElementById('studentSchool').textContent = session.school || 'مدرسة النخبة';
            document.getElementById('studentPhone').textContent = session.phone || '٠١٠٠٢٢٣٣٤٤٥';

            // Load bookings from Firebase
            loadBookings(session.email);

            console.log('✅ تم تحميل صفحة الحجز');
            console.log(`👤 المستخدم: ${session.email}`);
            console.log(`📚 عدد المواد: ${subjectsData.length}`);
        }

        // Start
        document.addEventListener('DOMContentLoaded', init);

        // Make functions global
        window.bookSubject = bookSubject;
        window.logout = logout;
        window.showToast = showToast;
        window.closeToast = closeToast;
    </script>
</body>
