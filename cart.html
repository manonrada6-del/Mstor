<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة المشتريات | متجر دارك</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Tahoma', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #0a0a0a;
      direction: rtl;
      color: #e0e0e0;
    }

    header {
      background: #0a0a12;
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .back-to-store {
      background: rgba(30, 30, 45, 0.8);
      padding: 10px 25px;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-to-store:hover {
      background: #1e1e2f;
      transform: scale(1.02);
    }

    .cart-page {
      min-height: calc(100vh - 80px);
      padding: 40px;
    }

    .cart-container {
      background: rgba(18, 18, 30, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 32px 35px;
      max-width: 1200px;
      margin: 0 auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .cart-container h2 {
      font-size: 32px;
      margin-bottom: 25px;
      color: #f0f0ff;
      border-right: 5px solid #a855f7;
      padding-right: 20px;
    }

    .cart-items-list {
      list-style: none;
      margin: 25px 0;
      max-height: 400px;
      overflow-y: auto;
    }

    .cart-items-list::-webkit-scrollbar {
      width: 6px;
    }

    .cart-items-list::-webkit-scrollbar-track {
      background: #1e1e2a;
      border-radius: 10px;
    }

    .cart-items-list::-webkit-scrollbar-thumb {
      background: #a855f7;
      border-radius: 10px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: rgba(0, 0, 0, 0.3);
      margin: 10px 0;
      border-radius: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .cart-item-info {
      display: flex;
      gap: 25px;
      align-items: center;
      flex-wrap: wrap;
    }

    .cart-item-name {
      font-size: 18px;
      font-weight: 600;
    }

    .cart-item-price {
      color: #c084fc;
      font-size: 18px;
      font-weight: bold;
    }

    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-btn {
      background: #2d2d44;
      border: none;
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    .quantity-btn:hover {
      background: #8b5cf6;
    }

    .cart-item-qty {
      font-size: 18px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }

    .remove-item-btn {
      background: linear-gradient(145deg, #dc2626, #991b1b);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }

    .remove-item-btn:hover {
      background: #b91c1c;
      transform: scale(0.96);
    }

    /* نموذج بيانات العميل */
    .checkout-section {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 2px solid rgba(139, 92, 246, 0.3);
    }

    .checkout-title {
      font-size: 24px;
      color: #c084fc;
      margin-bottom: 20px;
    }

    .customer-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: 600;
      color: #e2e8f0;
      font-size: 14px;
    }

    .form-group input, .form-group textarea {
      padding: 14px 18px;
      background: rgba(10, 10, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: white;
      font-size: 15px;
      transition: 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: #a855f7;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .checkout-btn {
      background: linear-gradient(135deg, #25D366, #128C7E);
      padding: 16px 32px;
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .checkout-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 20px rgba(37, 211, 102, 0.3);
    }

    .checkout-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .cart-summary {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid rgba(139, 92, 246, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .total-price {
      font-size: 28px;
      color: #facc15;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 800;
    }

    .clear-cart-btn {
      background: #2d2d44;
      border: 1px solid rgba(255, 100, 100, 0.3);
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      color: white;
    }

    .clear-cart-btn:hover {
      background: #3a3a5a;
      transform: translateY(-2px);
    }

    .empty-cart {
      text-align: center;
      padding: 60px;
      color: #9ca3af;
      font-size: 20px;
    }

    .toast {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1b2e;
      backdrop-filter: blur(20px);
      color: white;
      padding: 14px 32px;
      border-radius: 60px;
      animation: slideUpFade 0.4s ease forwards;
      z-index: 1000;
      font-weight: 600;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @media (max-width: 750px) {
      .cart-page {
        padding: 20px;
      }
      .cart-container {
        padding: 20px;
      }
      .cart-item {
        flex-direction: column;
        text-align: center;
      }
      .cart-summary {
        flex-direction: column;
      }
      .total-price {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>🛒 سلة المشتريات</h1>
  <a href="index.html" class="back-to-store">🏠 العودة للمتجر</a>
</header>

<div class="cart-page">
  <div class="cart-container">
    <h2>🛍️ سلة المشتريات</h2>
    <div id="cartContent"></div>
  </div>
</div>

<script>
  let cart = [];

  // رقم الواتساب المطلوب
  const WHATSAPP_NUMBER = "01016211389";

  // تحميل السلة من localStorage
  function loadCart() {
    const savedCart = localStorage.getItem("darkStoreCart");
    if (savedCart) {
      try {
        cart = JSON.parse(savedCart);
      } catch(e) {}
    }
    displayCart();
  }

  // عرض السلة مع نموذج إتمام الطلب
  function displayCart() {
    const cartContent = document.getElementById("cartContent");
    if (!cartContent) return;
    
    if (cart.length === 0) {
      cartContent.innerHTML = `<div class="empty-cart">🛍️ السلة فارغة، أضف بعض المنتجات الرائعة!</div>`;
      return;
    }
    
    let totalPrice = 0;
    let cartHtml = `<ul class="cart-items-list">`;
    
    cart.forEach((item, index) => {
      const itemTotal = item.price * item.quantity;
      totalPrice += itemTotal;
      cartHtml += `
        <li class="cart-item">
          <div class="cart-item-info">
            <span class="cart-item-name">${escapeHtml(item.name)}</span>
            <span class="cart-item-price">${item.price}$</span>
            <div class="cart-item-quantity">
              <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">−</button>
              <span class="cart-item-qty">${item.quantity}</span>
              <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
            </div>
          </div>
          <button class="remove-item-btn" onclick="removeCartItem(${index})">🗑️ إزالة</button>
        </li>
      `;
    });
    
    cartHtml += `</ul>`;
    
    // إضافة ملخص السلة
    cartHtml += `
      <div class="cart-summary">
        <div class="total-price">💰 الإجمالي: ${totalPrice}$</div>
        <button class="clear-cart-btn" onclick="clearCart()">🗑️ تفريغ السلة</button>
      </div>
    `;
    
    // إضافة نموذج بيانات العميل لإتمام الطلب
    cartHtml += `
      <div class="checkout-section">
        <div class="checkout-title">📋 إتمام الطلب</div>
        <div class="customer-form">
          <div class="form-group">
            <label>👤 الاسم الكامل</label>
            <input type="text" id="customerName" placeholder="أدخل اسمك الكامل">
          </div>
          <div class="form-group">
            <label>📞 رقم الهاتف</label>
            <input type="tel" id="customerPhone" placeholder="مثال: 01012345678">
          </div>
          <div class="form-group">
            <label>📍 العنوان (المدينة - الحي - الشارع)</label>
            <textarea id="customerAddress" placeholder="أدخل عنوانك بالتفصيل"></textarea>
          </div>
          <button class="checkout-btn" onclick="sendToWhatsApp()">
            💬 إتمام الطلب عبر واتساب
          </button>
        </div>
      </div>
    `;
    
    cartContent.innerHTML = cartHtml;
  }

  // دالة لحماية النصوص من الـ XSS
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // تحديث كمية منتج
  function updateQuantity(index, delta) {
    const newQuantity = cart[index].quantity + delta;
    if (newQuantity <= 0) {
      cart.splice(index, 1);
      showToast("🗑️ تم إزالة المنتج من السلة", "#f97316");
    } else {
      cart[index].quantity = newQuantity;
      showToast(`🔄 تم تحديث الكمية`, "#10b981");
    }
    saveCart();
    displayCart();
  }

  // إزالة منتج
  function removeCartItem(index) {
    const removedItem = cart[index];
    cart.splice(index, 1);
    saveCart();
    displayCart();
    showToast(`🗑️ تم إزالة ${removedItem.name} من السلة`, "#f97316");
  }

  // تفريغ السلة
  function clearCart() {
    if (cart.length === 0) {
      showToast("السلة فارغة بالفعل!", "#6b7280");
      return;
    }
    cart = [];
    saveCart();
    displayCart();
    showToast("🧹 تم تفريغ السلة بالكامل", "#dc2626");
  }

  // حفظ السلة في localStorage
  function saveCart() {
    localStorage.setItem("darkStoreCart", JSON.stringify(cart));
  }

  // إرسال الطلب عبر واتساب
  function sendToWhatsApp() {
    const customerName = document.getElementById("customerName")?.value.trim();
    const customerPhone = document.getElementById("customerPhone")?.value.trim();
    const customerAddress = document.getElementById("customerAddress")?.value.trim();
    
    // التحقق من صحة البيانات
    if (!customerName) {
      showToast("⚠️ الرجاء إدخال الاسم الكامل", "#f97316");
      document.getElementById("customerName")?.focus();
      return;
    }
    
    if (!customerPhone) {
      showToast("⚠️ الرجاء إدخال رقم الهاتف", "#f97316");
      document.getElementById("customerPhone")?.focus();
      return;
    }
    
    // التحقق من صيغة رقم الهاتف (أرقام فقط وليس أقل من 10 أرقام)
    const phoneRegex = /^[0-9]{10,11}$/;
    if (!phoneRegex.test(customerPhone.replace(/[^0-9]/g, ''))) {
      showToast("⚠️ الرجاء إدخال رقم هاتف صحيح (10-11 رقم)", "#f97316");
      return;
    }
    
    if (!customerAddress) {
      showToast("⚠️ الرجاء إدخال العنوان", "#f97316");
      document.getElementById("customerAddress")?.focus();
      return;
    }
    
    // حساب إجمالي الطلب
    let totalPrice = 0;
    let orderDetails = "";
    
    cart.forEach((item, index) => {
      const itemTotal = item.price * item.quantity;
      totalPrice += itemTotal;
      orderDetails += `${index + 1}️⃣ ${item.name} | ${item.price}$ × ${item.quantity} = ${itemTotal}$\n`;
    });
    
    // إنشاء رسالة الواتساب
    const currentDate = new Date();
    const formattedDate = `${currentDate.getFullYear()}-${currentDate.getMonth()+1}-${currentDate.getDate()} ${currentDate.getHours()}:${currentDate.getMinutes()}`;
    
    const message = `🛍️ *طلب جديد من المتجر*\n\n` +
      `━━━━━━━━━━━━━━━━━━━━\n` +
      `👤 *اسم العميل:* ${customerName}\n` +
      `📞 *رقم الجوال:* ${customerPhone}\n` +
      `📍 *العنوان:* ${customerAddress}\n` +
      `━━━━━━━━━━━━━━━━━━━━\n` +
      `📦 *تفاصيل الطلب:*\n${orderDetails}\n` +
      `━━━━━━━━━━━━━━━━━━━━\n` +
      `💰 *الإجمالي:* ${totalPrice}$\n` +
      `🕐 *تاريخ الطلب:* ${formattedDate}\n` +
      `━━━━━━━━━━━━━━━━━━━━\n` +
      `✅ يرجى التواصل مع العميل لتأكيد الطلب.`;
    
    // ترميز الرسالة للـ URL
    const encodedMessage = encodeURIComponent(message);
    
    // فتح رابط واتساب
    const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
    
    // حفظ الطلب في localStorage كسجل (اختياري)
    const orderHistory = JSON.parse(localStorage.getItem("orderHistory") || "[]");
    orderHistory.push({
      id: Date.now(),
      customerName,
      customerPhone,
      customerAddress,
      items: [...cart],
      total: totalPrice,
      date: formattedDate
    });
    localStorage.setItem("orderHistory", JSON.stringify(orderHistory));
    
    // فتح الواتساب في نافذة جديدة
    window.open(whatsappUrl, '_blank');
    
    // تفريغ السلة بعد إتمام الطلب
    cart = [];
    saveCart();
    displayCart();
    
    showToast("✅ تم إرسال طلبك بنجاح! سيتم تحويلك إلى واتساب", "#25D366");
  }

  // رسائل منبثقة
  function showToast(message, bgColor) {
    const oldToast = document.querySelector(".toast");
    if (oldToast) oldToast.remove();
    
    let toast = document.createElement("div");
    toast.className = "toast";
    toast.innerText = message;
    toast.style.background = bgColor;
    document.body.appendChild(toast);
    
    setTimeout(() => {
      if (toast && toast.remove) toast.remove();
    }, 3000);
  }

  // تحميل الصفحة
  loadCart();
</script>
</body>
  </html>
