<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة المشتريات | متجر دارك</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Tahoma', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #0a0a0a;
      direction: rtl;
      color: #e0e0e0;
    }

    header {
      background: #0a0a12;
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .back-to-store {
      background: rgba(30, 30, 45, 0.8);
      padding: 10px 25px;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-to-store:hover {
      background: #1e1e2f;
      transform: scale(1.02);
    }

    .cart-page {
      min-height: calc(100vh - 80px);
      padding: 40px;
    }

    .cart-container {
      background: rgba(18, 18, 30, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 32px 35px;
      max-width: 1200px;
      margin: 0 auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .cart-container h2 {
      font-size: 32px;
      margin-bottom: 25px;
      color: #f0f0ff;
      border-right: 5px solid #a855f7;
      padding-right: 20px;
    }

    .cart-items-list {
      list-style: none;
      margin: 25px 0;
      max-height: 500px;
      overflow-y: auto;
    }

    .cart-items-list::-webkit-scrollbar {
      width: 6px;
    }

    .cart-items-list::-webkit-scrollbar-track {
      background: #1e1e2a;
      border-radius: 10px;
    }

    .cart-items-list::-webkit-scrollbar-thumb {
      background: #a855f7;
      border-radius: 10px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: rgba(0, 0, 0, 0.3);
      margin: 10px 0;
      border-radius: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .cart-item-info {
      display: flex;
      gap: 25px;
      align-items: center;
      flex-wrap: wrap;
    }

    .cart-item-name {
      font-size: 20px;
      font-weight: 600;
    }

    .cart-item-price {
      color: #c084fc;
      font-size: 18px;
      font-weight: bold;
    }

    .cart-item-quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-btn {
      background: #2d2d44;
      border: none;
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    .quantity-btn:hover {
      background: #8b5cf6;
    }

    .cart-item-qty {
      font-size: 18px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }

    .remove-item-btn {
      background: linear-gradient(145deg, #dc2626, #991b1b);
      color: white;
      border: none;
      padding: 8px 20px;
